name: probe-fussballde
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          g(){ curl -sSL -A "$UA" -o "$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> log.txt; }
          g team4.html "https://www.fussball.de/mannschaft/niendorf-4d-jun-a2-niendorf-hamburg/-/saison/2627/team-id/02JAE3FD60000000VS5489B2VV3G3E4A"
          g plan4.html "https://www.fussball.de/ajax.team.matchplan/-/mode/PAGE/team-id/02JAE3FD60000000VS5489B2VV3G3E4A"
          g plan4b.html "https://www.fussball.de/ajax.team.matchplan/-/mime-type/HTML/mode/PAGE/show-filter/false/max/99/team-id/02JAE3FD60000000VS5489B2VV3G3E4A/datum-von/2026-11-01/datum-bis/2027-03-31"
          g match.html "https://www.fussball.de/spiel/glashuette-1d-jun-a1-niendorf-4d-jun-a2/-/spiel/0328G27B2S000000VS5489BTVUCVBQ5B"
          git init -q . && git checkout -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
