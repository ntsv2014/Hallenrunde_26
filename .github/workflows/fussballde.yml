name: fussball.de abrufen
on:
  schedule:
    - cron: "*/15 7-20 * * 6,0"   # Sa/So 08:00–21:45 (Winterzeit) alle 15 min
    - cron: "47 6,17 * * 1"       # Montag 07:47 und 18:47 (Nachträge)
  workflow_dispatch:
    inputs:
      team:
        description: "n4 (Blau, JH 05), n5 (Weiß, JH 04) oder beide"
        default: "beide"
permissions:
  contents: write
concurrency:
  group: fussballde
  cancel-in-progress: false
jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q fonttools
      - name: Abrufen
        run: |
          T="${{ github.event.inputs.team }}"; [ "$T" = "beide" -o -z "$T" ] && T="n4 n5"
          A=""; [ "${{ github.event_name }}" = "schedule" ] && A="--scheduled"
          python3 tools/fetch_fd.py $T $A | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Neue Ansetzungen (nur beim Abruf über den Button)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 tools/ansetzungen.py | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --quiet -- index.html || node tools/mkics.js
      - name: Speichern
        run: |
          git add -A index.html cal checks
          git diff --cached --quiet && exit 0
          git config user.name "fussball.de-Abruf"; git config user.email "actions@github.com"
          git commit -qm "Tabellen/Ergebnisse von fussball.de ($(TZ=Europe/Berlin date '+%d.%m. %H:%M'))"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
