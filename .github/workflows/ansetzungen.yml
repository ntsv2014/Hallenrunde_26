name: Ansetzungen prüfen
on:
  schedule:
    - cron: "17 5 * * *"     # täglich 6:17 Uhr (Winterzeit)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fussballde
  cancel-in-progress: false
jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q fonttools
      - name: Abgleich mit fussball.de
        run: python3 tools/ansetzungen.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Speichern
        run: |

          if ! git diff --quiet -- index.html; then node tools/mkics.js; fi
          git config user.name "fussball.de-Abruf"; git config user.email "actions@github.com"
          git add -A index.html cal checks
          git diff --cached --quiet && exit 0
          git commit -qm "Ansetzungen von fussball.de ($(TZ=Europe/Berlin date '+%d.%m. %H:%M'))"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
