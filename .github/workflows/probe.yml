name: probe-fussballde
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          for id in 9q8et5s5 tfxe1wcz; do
            curl -sSL -A "$UA" -o $id.css "https://www.fussball.de/export.fontface/-/id/$id/type/css"
            cat $id.css >> log.txt
            for u in $(grep -o "url([^)]*)" $id.css | sed 's/url(//;s/)//;s/["'"'"']//g'); do
              case "$u" in //*) u="https:$u";; /*) u="https://www.fussball.de$u";; esac
              f=$(echo "$u" | sed 's#.*/##;s/[?#].*//'); curl -sSL -A "$UA" -o "${id}_$f" "$u"; echo "$u -> ${id}_$f" >> log.txt
            done
          done
          ls -la >> log.txt
          git init -q . && git checkout -q -b probe && git add -A
          git -c user.name=probe -c user.email=probe@x commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
